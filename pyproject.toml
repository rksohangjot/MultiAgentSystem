[project]
name = "ecommerce-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_agents"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["llm: tests that call the real Groq API"]
