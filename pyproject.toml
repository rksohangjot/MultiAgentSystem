[project]
name = "ecommerce-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["llm: tests that call the real Groq API"]
